# Videotab, au plus simple : une image publique, un volume, rien à construire.
#
#   docker compose up -d
#
# À savoir : l'encodage de la vidéo se fait dans le navigateur, pas dans ce conteneur. Le
# serveur ne fait que garder les fichiers et les comptes — il tourne donc très bien sur un
# NAS, mais c'est la machine qui regarde qui doit tenir l'encodage en temps réel.
#
# Pour partir des sources plutôt que de l'image publiée, décommenter « build » et lancer
# « docker compose up -d --build ».

name: videotab

services:
  videotab:
    image: ${VIDEOTAB_IMAGE:-ghcr.io/fuzzinvaders/videotab:latest}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: videotab
    restart: unless-stopped
    environment:
      # Origine publique de l'app, à ne renseigner QUE derrière un reverse proxy
      # (ex: https://videotab.exemple.fr) — ça active une vérification anti-CSRF sur les
      # requêtes d'écriture. En local, laisse vide : le port hôte (voir HOST_PORT ci-dessous)
      # ne correspond pas forcément au port interne (3000), une valeur par défaut serait donc
      # fausse la moitié du temps.
      ORIGIN: ${ORIGIN:-}
      # Secret de signature des sessions (openssl rand -hex 32). Si vide, un secret aléatoire
      # est généré et persisté dans le volume de données.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Taille maximale d'une vidéo envoyée, en mégaoctets. Une minute de 1080p en VP9 pèse
      # une quinzaine de mégaoctets ; 512 laisse donc passer un morceau très long.
      VIDEO_MAX_MB: ${VIDEO_MAX_MB:-512}
    volumes:
      # Persiste les comptes, la bibliothèque, les tablatures et les vidéos produites.
      - videotab-data:/data
    ports:
      # host:container — l'app écoute sur 3000 dans le conteneur.
      # Change HOST_PORT si 8080 est déjà pris sur ta machine.
      - "${HOST_PORT:-8080}:3000"

volumes:
  videotab-data:
