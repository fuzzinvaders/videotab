<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Videotab">
  <!-- Le fond couvre tout le carré : Android redécoupe l'icône selon la forme du lanceur,
       et un dessin transparent y ressortirait sur un damier. -->
  <rect width="512" height="512" rx="112" fill="#020617" />

  <!-- Six cordes : la signature visuelle d'une tablature, reconnaissable avant d'être lue. -->
  <g stroke="#475569" stroke-width="14" stroke-linecap="round">
    <line x1="122" y1="176" x2="390" y2="176" />
    <line x1="122" y1="216" x2="390" y2="216" />
    <line x1="122" y1="256" x2="390" y2="256" />
    <line x1="122" y1="296" x2="390" y2="296" />
    <line x1="122" y1="336" x2="390" y2="336" />
  </g>

  <!-- Le curseur, qui est tout le sujet : la traînée derrière lui, le trait vif dessus. -->
  <rect x="122" y="150" width="122" height="212" rx="10" fill="#f59e0b" opacity="0.28" />
  <rect x="236" y="142" width="18" height="228" rx="9" fill="#f59e0b" />
</svg>
